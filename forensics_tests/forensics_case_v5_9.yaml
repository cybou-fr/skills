version: '5.9'
scenarios:
- id: create-case
  actions:
  - create:
      title: Suspicious IAM Activity
      severity: high
      owner: soc
  expected:
    case_count: 1
    status: open
- id: attach-redacted-evidence
  actions:
  - create:
      title: Token Leak
      severity: high
  - evidence:
      source: ci-log
      content: 2026-06-10T10:00:00Z token=abc123456789SECRET leaked
      collector: analyst
      type: log
  expected:
    evidence_count: 1
    redaction_applied: true
    custody_valid: true
- id: timeline-ordering
  actions:
  - create:
      title: Timeline Test
  - timeline:
      timestamp: 200.0
      summary: second event
      source: edr
  - timeline:
      timestamp: 100.0
      summary: first event
      source: siem
  expected:
    timeline_count: 2
    first_summary: first event
- id: case-export
  actions:
  - create:
      title: Export Test
  - evidence:
      source: cloudtrail
      content: 2026-06-10T12:00:00Z CreateAccessKey from 203.0.113.7
      collector: analyst
      type: cloud_audit
  expected:
    export_evidence_count: 1
    custody_valid: true
