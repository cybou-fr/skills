version: '5.5'
scenarios:
- id: rustfmt-clippy-gate
  input: Add CI gate for cargo fmt and cargo clippy -D warnings
  expected:
    risk: low
    decision: allow_read_only
    required_skills:
    - rust-linting-and-formatting
    - rust-ci-quality-gates
    tool: cargo
- id: nextest-workspace
  input: Use cargo nextest for workspace tests
  expected:
    risk: low
    decision: allow_read_only
    required_skills:
    - rust-test-infrastructure
    tool: cargo-nextest
- id: coverage-llvm-cov
  input: Add cargo llvm-cov coverage reporting
  expected:
    risk: medium
    decision: allow_read_only
    required_skills:
    - rust-coverage-workflow
    tool: cargo-llvm-cov
- id: miri-unsafe-review
  input: Run cargo miri test for unsafe code in adapter crate
  expected:
    risk: high
    decision: review_required
    required_skills:
    - rust-miri-unsafe-validation
    - rust-security-hardening
    tool: cargo-miri
- id: fuzz-command-normalizer
  input: Add cargo fuzz target for command normalization parser
  expected:
    risk: high
    decision: approval_required_with_sandbox_and_time_limit
    required_skills:
    - rust-fuzzing-and-property-testing
    - command-safety
    tool: cargo-fuzz
- id: criterion-policy-bench
  input: Benchmark policy decision engine with Criterion
  expected:
    risk: medium
    decision: allow_read_only
    required_skills:
    - rust-benchmarking-and-profiling
    - cybou-policy-engine-implementation
    tool: criterion
- id: cargo-hack-feature-powerset
  input: Validate feature powerset with cargo hack
  expected:
    risk: medium
    decision: allow_read_only
    required_skills:
    - rust-feature-matrix-and-hack
    tool: cargo-hack
- id: cargo-udeps-cleanup
  input: Find unused dependencies with cargo udeps
  expected:
    risk: medium
    decision: allow_read_only
    required_skills:
    - rust-dead-code-and-dependency-hygiene
    tool: cargo-udeps
- id: semver-checks-release
  input: Run cargo semver-checks before releasing crate
  expected:
    risk: medium
    decision: allow_read_only
    required_skills:
    - rust-release-and-semver
    tool: cargo-semver-checks
- id: cargo-publish-release
  input: Publish CYBOU crate to crates.io after checks
  expected:
    risk: high
    decision: approval_required
    required_skills:
    - rust-release-and-semver
    - rust-dependency-supply-chain-review
    tool: cargo
    must_not_execute_without_approval: true
- id: rust-toolchain-template
  input: Create rust-toolchain.toml, rustfmt.toml, clippy.toml and deny.toml for CYBOU
  expected:
    risk: medium
    decision: draft_config
    required_skills:
    - rust-toolchain-management
    - rust-linting-and-formatting
    - rust-ci-quality-gates
- id: msrv-verify
  input: Verify MSRV for workspace
  expected:
    risk: medium
    decision: allow_read_only
    required_skills:
    - rust-toolchain-management
    - rust-release-and-semver
    tool: cargo-msrv
