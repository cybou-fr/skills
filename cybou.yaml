version: '6.9'
name: cybou-skills-corpus
repository_role: skills_corpus_only
contains_runtime_code: false
cybou_core_patches: false
description: External skills, policies, evals, schemas, tool metadata and trust manifests for Cybou.
canonical_entrypoints:
- README.md
- registry.yaml
- output_templates.yaml
- integration/loader_manifest.yaml
- integration/file_hashes.yaml
- integration/supply_chain_manifest.yaml
- integration/signing_policy.yaml
- integration/provenance_manifest.yaml
- evals/manifest.yaml
- immunity_mapping/immunity_manifest.yaml
- immunity_mapping/argv_normalization_contract.yaml
- docs/VALIDATION_GUIDE.md
- docs/PUBLIC_RELEASE_CHECKLIST.md
- .github/workflows/validate.yml
- semantic_review/semantic_review_manifest.yaml
canonical_directories:
- core
- devops
- secops
- productivity
- policy_rules
- activity_policies
- tool_adapters
- scope_objects
- schemas
- evals
- integration
- immunity_mapping
- docs
- examples
- scripts
- semantic_review
forbidden_content:
- cybou-core Rust implementation
- runtime_prototype
- reference_prototype
- cybou-core patches
- MicroVM implementation code
- CLI implementation patches
validation:
  scripts:
  - scripts/validate_pack_v6_1.py
  - scripts/validate_loader_contract_v6_2.py
  - scripts/validate_immunity_compat_v6_3.py
  - scripts/validate_supply_chain_v6_4.py
  - scripts/validate_skill_vetting_rules_v6_4.py
  - scripts/validate_command_patterns_v6_4.py
  - scripts/validate_eval_contract_v6_5.py
  - scripts/validate_adversarial_immunity_v6_5.py
  - scripts/validate_release_signing_v6_6.py
  - scripts/validate_policy_hardening_v6_7.py
  - scripts/validate_public_repository_cleanup_v6_8.py
  - scripts/validate_metadata_canonicalization_v6_8_1.py
  - scripts/validate_all.py
  - scripts/validate_public_docs_v6_8_2.py
  - scripts/validate_semantic_review_v6_9.py
loader_behavior:
  first_load: metadata_only
  full_body_access: requires_vetting
  enterprise_unsigned_release: deny_until_signed
  community_unsigned_release: warn_and_metadata_only
