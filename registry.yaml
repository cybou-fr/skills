version: '6.9'
package: cybou-devops-secops-agent-skills
description: AgentSkills-compatible runtime-oriented DevOps/SecOps skill library for CYBOU or other AI workers.
default_mode: read_only
skill_selection_policy:
  load_order:
  - AGENTS.md
  - registry.yaml
  - risk_matrix.yaml
  - tool_policies.yaml
  - selected SKILL.md
  avoid_operational_skills_for:
  - general education
  - pure definitions
  - non-operational tutorials
  unknown_environment: read_only
skills:
- id: task-classification
  path: core/task-classification/SKILL.md
  category: core
  triggers:
  - classify task
  - select skill
  - devops request
  - secops request
  - operational request
  default_risk: low
  default_mode: read_only
  requires_tools: []
  input_types:
  - user_request
  output_template: generic_task_report
  related_skills:
  - risk-and-approval
  - environment-detection
  do_not_use_for:
  - general education
  - pure definitions
  - tutorial-only questions
  autonomy_level: 1
