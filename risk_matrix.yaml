corpus_version: '7.0'
policy_version: '7.0'
default_environment_when_unknown: unknown
unknown_environment_policy: read_only
skill_format_version: operational_contract_v1
risk_levels:
  low:
    score_range: 0-1
    description: Read-only, no sensitive data exposure, no external side effects, no production impact.
    approval_required: false
  medium:
    score_range: 2-3
    description: Reversible VM-local or non-production actions, drafts, local patches, dry-run reviews, bounded recovery.
    approval_required: policy_gated
  high:
    score_range: 4-6
    description: Production, customer data, secrets, IAM, security controls, cost, external communication, database writes, service restarts in unknown environments.
    approval_required: true
    default_decision: block_or_emit_approval_artifact
  critical:
    score_range: 7+
    description: Irreversible, destructive, security-sensitive, data-loss, exposure, or policy-bypass actions.
    approval_required: true
    default_decision: refuse_or_escalate
scoring:
  base:
    read_only: 0
    review_only: 1
    draft_only: 1
    write_local: 1
    write_development: 2
    write_staging: 3
    write_production: 4
  modifiers:
    secrets_involved: 3
    iam_involved: 3
    customer_data_involved: 3
    database_write: 3
    irreversible: 4
    destructive_command: 4
    external_side_effect: 2
    unknown_environment: 2
    no_backup: 2
    no_rollback: 2
    security_incident: 2
    public_exposure: 3
  thresholds:
    low: [0, 1]
    medium: [2, 3]
    high: [4, 6]
    critical_min: 7
critical_actions:
  - delete_database
  - delete_namespace
  - terraform_destroy
  - disable_mfa
  - disable_audit_logs
  - expose_secret
  - publicize_private_data
  - change_admin_iam
  - purge_logs
  - destructive_production_change
  - policy_engine_bypass
  - unreviewed_tool_adapter_change
risk_floor:
  secrets_involved: high
  iam_change: high
  database_write: high
  public_exposure: high
  service_restart_unknown_environment: high
  production_write: high
  terraform_destroy: critical
  terraform_force_unlock: critical
  kubectl_delete_namespace: critical
  database_drop: critical
  database_truncate: critical
  disable_mfa: critical
  disable_audit_logs: critical
  purge_logs: critical
approval_policy:
  low:
    explicit_confirmation_required: false
  medium:
    explicit_confirmation_required: policy_gated_for_write_actions
  high:
    explicit_confirmation_required: true
    approval_scope_required: true
    default_decision: block_or_emit_approval_artifact
  critical:
    explicit_confirmation_required: true
    approval_scope_required: true
    default_decision: refuse_or_escalate
environment_rules:
  unknown:
    max_autonomy: read_only
    write_actions: deny
  production:
    write_actions: approval_required
    destructive_actions: deny_by_default
  customer:
    write_actions: approval_required
    destructive_actions: deny_by_default
  staging:
    write_actions: approval_recommended
    destructive_actions: approval_required
  local_sandbox:
    write_actions: policy_gated
    destructive_actions: approval_required
