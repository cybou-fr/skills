version: '6.3'
targets:
- id: shadow
  pattern: /etc/shadow
  risk: high
  verdict: NeedsApproval
- id: sudoers
  pattern: /etc/sudoers
  risk: high
  verdict: NeedsApproval
- id: ssh-private-keys
  pattern: ~/.ssh
  risk: high
  verdict: NeedsApproval
- id: boot
  pattern: /boot
  risk: high
  verdict: NeedsApproval
- id: rootfs
  pattern: /
  risk: critical
  verdict: Deny
  when: destructive_write_or_delete
- id: env-files
  pattern: .env
  risk: high
  verdict: NeedsApproval
- id: kubeconfig
  pattern: kubeconfig
  risk: high
  verdict: NeedsApproval
- id: docker-config
  pattern: ~/.docker/config.json
  risk: high
  verdict: NeedsApproval
- id: cloud-credentials
  pattern: ~/.aws/credentials
  risk: high
  verdict: NeedsApproval
- id: gcp-credentials
  pattern: application_default_credentials.json
  risk: high
  verdict: NeedsApproval
