version: '6.7'
patterns:
- id: remote-pipe-shell
  regex: (?i)\b(curl|wget)\b[^\n|;]*\|\s*(sudo\s+)?(sh|bash|zsh|python|python3|perl|ruby|node)\b
  verdict: Deny
  risk: critical
  reason: remote script piped to interpreter
- id: rm-rf-root
  regex: (?i)(^|\s)(sudo\s+)?(command\s+|env\s+)?(/bin/|/usr/bin/)?rm\s+(-[A-Za-z]*r[A-Za-z]*f[A-Za-z]*|-[A-Za-z]*f[A-Za-z]*r[A-Za-z]*|--recursive\s+--force|--force\s+--recursive)\s+(--\s+)?(/(\s|$)|/\*|~(\s|$)|\$HOME(\s|$)|\"\$HOME\"|'?\$HOME'?)
  verdict: Deny
  risk: critical
  reason: destructive root/home removal including rm -rf / variants
- id: mkfs
  regex: \bmkfs(\.[a-z0-9]+)?\b
  verdict: Deny
  risk: critical
  reason: filesystem formatting
- id: dd-to-disk
  regex: \bdd\b.*\bof=/dev/
  verdict: Deny
  risk: critical
  reason: raw disk write
- id: fork-bomb
  regex: :\(\)\s*\{\s*:\|:\s*&\s*\}\s*;
  verdict: Deny
  risk: critical
  reason: fork bomb
- id: chmod-777-sensitive
  regex: \bchmod\s+777\b.*(/etc|/boot|/usr|/var|~/.ssh)
  verdict: NeedsApproval
  risk: high
  reason: unsafe permissions on sensitive path
- id: terraform-destroy
  regex: \bterraform\b.*\bdestroy\b
  verdict: NeedsApproval
  risk: high
  reason: terraform destroy
- id: terraform-auto-approve
  regex: \bterraform\b.*\b(apply|destroy)\b.*-auto-approve
  verdict: Deny
  risk: critical
  reason: terraform auto-approve mutation
- id: kubectl-delete
  regex: \bkubectl\b.*\bdelete\b
  verdict: NeedsApproval
  risk: high
  reason: kubernetes deletion
- id: kubectl-delete-namespace
  regex: \bkubectl\b.*\bdelete\b.*\b(ns|namespace|namespaces)\b
  verdict: Deny
  risk: critical
  reason: namespace deletion
- id: docker-privileged
  regex: \bdocker\b.*\brun\b.*--privileged
  verdict: Deny
  risk: critical
  reason: privileged container
- id: docker-socket-mount
  regex: \bdocker\b.*(-v|--volume)\s+/var/run/docker\.sock
  verdict: Deny
  risk: critical
  reason: host docker socket mount
- id: git-force-push
  regex: \bgit\b.*\bpush\b.*--force
  verdict: NeedsApproval
  risk: high
  reason: force push
- id: drop-database
  regex: (?i)\bDROP\s+DATABASE\b
  verdict: Deny
  risk: critical
  reason: database destruction
- id: truncate-table
  regex: (?i)\bTRUNCATE\s+TABLE\b
  verdict: NeedsApproval
  risk: high
  reason: table truncation
- id: secret-path-read
  regex: (/etc/shadow|/etc/sudoers|~/.ssh|\.env\b|id_rsa|id_ed25519)
  verdict: NeedsApproval
  risk: high
  reason: sensitive credential/config path
- id: nested-interpreter
  regex: (?i)\b(bash|sh|zsh|python|python3|perl|ruby|node)\s+(-c|-lc|-e)\b
  verdict: NeedsApproval
  risk: high
  reason: nested interpreter execution
- id: base64-decode-exec
  regex: \bbase64\b.*(-d|--decode).*\|\s*(sh|bash|python|perl|ruby)
  verdict: Deny
  risk: critical
  reason: encoded payload execution
- id: interpreter-rm-rf-root
  regex: (?is)\b(python|python3|perl|ruby|node|bash|sh|zsh)\b.*\b(os\.system|subprocess|child_process|system|exec|run)\b.*(rm\s*[-'\"]*,?\s*['\"]?-?[A-Za-z]*r[A-Za-z]*f[A-Za-z]*|rm\s+-[A-Za-z]*r[A-Za-z]*f[A-Za-z]*).*?(\/|['\"]\/['\"])
  verdict: Deny
  risk: critical
  reason: nested interpreter attempts destructive root removal
- id: bash-lc-rm-rf-root
  regex: (?i)\b(bash|sh|zsh)\s+(-c|-lc)\s+['\"][^'\"]*rm\s+-[A-Za-z]*r[A-Za-z]*f[A-Za-z]*\s+/
  verdict: Deny
  risk: critical
  reason: shell -c destructive root removal
- id: kubectl-delete-system-namespace
  regex: (?i)\bkubectl\b.*\bdelete\b.*\b(ns|namespace|namespaces)\b.*\b(kube-system|default|prod|production|payments)\b
  verdict: Deny
  risk: critical
  reason: sensitive namespace deletion
- id: docker-host-root-mount
  regex: (?i)\bdocker\b.*\brun\b.*(-v|--volume)\s+/:/[^/\s]+
  verdict: Deny
  risk: critical
  reason: host root mounted into container
- id: psql-drop-database
  regex: (?i)\b(psql|mysql|mariadb|sqlite3)\b.*\bDROP\s+DATABASE\b
  verdict: Deny
  risk: critical
  reason: database drop through CLI
- id: git-force-with-lease
  regex: (?i)\bgit\b.*\bpush\b.*--force-with-lease
  verdict: NeedsApproval
  risk: high
  reason: force-with-lease still rewrites remote history
- id: find-delete-root
  regex: (?i)\bfind\s+/\s+.*-delete\b
  verdict: Deny
  risk: critical
  reason: find delete from root
- id: chmod-recursive-root
  regex: (?i)\bchmod\s+(-R|--recursive)\s+(777|666|a\+rw[x]?)\s+/
  verdict: Deny
  risk: critical
  reason: recursive unsafe permissions on root
- id: chown-recursive-root
  regex: (?i)\bchown\s+(-R|--recursive)\s+[^ ]+\s+/
  verdict: NeedsApproval
  risk: high
  reason: recursive ownership change on root
- id: tar-extract-to-root
  regex: (?i)\btar\b.*(\s-C\s+|\s--directory\s+)/(\s|$)
  verdict: NeedsApproval
  risk: high
  reason: archive extraction into root filesystem
- id: curl-pipe-env-bash
  regex: (?i)\b(curl|wget)\b[^\n|;]*\|\s*env\s+(bash|sh|zsh|python|python3)\b
  verdict: Deny
  risk: critical
  reason: remote script piped through env interpreter
- id: helm-uninstall
  regex: (?i)\bhelm\b.*\b(uninstall|delete)\b
  verdict: NeedsApproval
  risk: high
  reason: helm release removal
- id: aws-s3-rm-recursive
  regex: (?i)\baws\b\s+s3\s+rm\b.*--recursive
  verdict: NeedsApproval
  risk: high
  reason: recursive S3 deletion
- id: cloud-delete-destructive
  regex: (?i)\b(aws|az|gcloud)\b.*\b(delete|remove|destroy|terminate)\b
  verdict: NeedsApproval
  risk: high
  reason: cloud resource mutation/destruction
- id: git-push-mirror
  regex: (?i)\bgit\b.*\bpush\b.*--mirror
  verdict: NeedsApproval
  risk: high
  reason: mirror push rewrites/deletes remote refs
- id: git-reset-hard
  regex: (?i)\bgit\b.*\breset\b.*--hard
  verdict: NeedsApproval
  risk: medium
  reason: hard reset discards local work
- id: drop-schema-cascade
  regex: (?i)\bDROP\s+SCHEMA\b.*\bCASCADE\b
  verdict: Deny
  risk: critical
  reason: schema drop cascade
- id: docker-host-namespaces
  regex: (?i)\bdocker\b.*\brun\b.*--(pid|net|ipc)=host
  verdict: Deny
  risk: critical
  reason: container joins host namespaces
- id: cargo-publish
  regex: (?i)\bcargo\s+publish\b
  verdict: NeedsApproval
  risk: high
  reason: publishes crate externally
- id: npm-publish
  regex: (?i)\bnpm\s+publish\b
  verdict: NeedsApproval
  risk: high
  reason: publishes package externally
- id: pip-upload
  regex: (?i)\b(twine\s+upload|python\s+-m\s+twine\s+upload)\b
  verdict: NeedsApproval
  risk: high
  reason: publishes python package externally
matching_policy:
  first_match: false
  take_highest_risk: true
  deny_overrides_approval: true
  needs_approval_overrides_allow: true
