  kubectl:
    adapter: GuestExecutor
    boundary: MicroVM
    requires_immunity: true
  terraform:
    adapter: GuestExecutor
    boundary: MicroVM
    requires_immunity: true
  database:
    adapter: GuestExecutor
    boundary: MicroVM
