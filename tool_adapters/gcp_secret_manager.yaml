tool: gcp_secret_manager
version: '5.8'
adapter_type: secrets_management
decision_inputs:
- project
- secret
- iam_policy
enforcement:
  read_only_by_default: true
  redaction_required: true
allowed_read_only:
- list_secrets
- describe_secret
- get_iam_policy
approval_required:
- add_secret_version
- delete_secret
- destroy_secret_version
- set_iam_policy
