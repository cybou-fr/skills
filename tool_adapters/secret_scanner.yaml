tool: secret_scanner
version: '4.2'
adapter_type: scanner
decision_inputs:
- target
- scope
- repository
- file_set
- approval_state
enforcement:
  read_only: true
  redaction_required: true
  do_not_print_secret_values: true
allowed:
- scan_local_files
- scan_diff
- scan_repository_metadata
approval_required:
- scan_private_repository
- scan_production_logs
