tool: helm
version: '4.2'
adapter_type: command
decision_inputs:
- subcommand
- release
- namespace
- environment
- approval_state
enforcement:
  read_only_by_default: true
  redaction_required: true
allowed_read_only:
- list
- status
- history
- get values
- get manifest
approval_required:
- upgrade
- rollback
- uninstall
- install
denied_by_default:
- upgrade_production_without_approval
