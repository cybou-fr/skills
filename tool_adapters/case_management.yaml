tool: case_management
version: '5.9'
adapter_type: incident_case
decision_inputs:
- case_id
- status
- severity
- owner
- evidence_ids
enforcement:
  read_only_by_default: true
  redaction_required: true
allowed_read_only:
- read_case
- list_cases
- export_case_summary
- read_evidence_links
approval_required:
- close_case
- delete_case
- change_severity
- assign_external_recipient
