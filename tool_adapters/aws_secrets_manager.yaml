tool: aws_secrets_manager
version: '5.8'
adapter_type: secrets_management
decision_inputs:
- account
- region
- secret_id
- policy
enforcement:
  read_only_by_default: true
  redaction_required: true
allowed_read_only:
- list_secrets
- describe_secret
- get_resource_policy
approval_required:
- rotate_secret
- put_secret_value
- delete_secret
- update_secret_version_stage
