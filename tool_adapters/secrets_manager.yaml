tool: secrets_manager
version: '4.2'
adapter_type: secrets_api
decision_inputs:
- operation
- secret_id
- environment
- approval_state
enforcement:
  metadata_only_by_default: true
  redaction_required: true
  audit_required: true
allowed_read_only:
- list_metadata
- describe_secret
- check_rotation_status
approval_required:
- create_secret
- update_secret
- rotate_secret
- delete_secret
denied:
- reveal_secret_value
