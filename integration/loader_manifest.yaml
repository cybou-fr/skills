version: 6.8.0
loader_contract: Cybou Core Skills Loader Contract v1
role: metadata-first external corpus
required_files:
- README.md
- registry.yaml
- output_templates.yaml
- package.yaml
- integration/decision_mapping.yaml
- integration/tool_classes.yaml
- integration/cybou_core_mapping.yaml
- integration/loader_manifest.yaml
- immunity_mapping/immunity_manifest.yaml
- immunity_mapping/decision_mapping.yaml
- immunity_mapping/risk_mapping.yaml
- immunity_mapping/tool_class_mapping.yaml
- immunity_mapping/command_pattern_mapping.yaml
- immunity_mapping/sensitive_targets.yaml
- integration/supply_chain_manifest.yaml
- integration/file_hashes.yaml
- integration/vetting_rules.yaml
- integration/quarantine_policy.yaml
- immunity_mapping/command_pattern_tests.yaml
- evals/manifest.yaml
- evals/immunity_adversarial/command_adversarial_v6_5.yaml
- integration/signing_policy.yaml
- integration/trusted_publishers.yaml
- integration/provenance_manifest.yaml
- integration/signature_status.yaml
- integration/release_signature.placeholder
- immunity_mapping/argv_normalization_contract.yaml
- immunity_mapping/destructive_command_tests.yaml
- immunity_mapping/cloud_cli_dangerous_ops.yaml
- immunity_mapping/package_publish_policy.yaml
- CONTRIBUTING.md
- SECURITY.md
- SKILL_AUTHORING_GUIDE.md
- RELEASE.md
- docs/REPOSITORY_BOUNDARIES.md
canonical_dirs:
- core/
- devops/
- secops/
- productivity/
- policy_rules/
- activity_policies/
- schemas/
- tool_adapters/
- scope_objects/
- evals/
- docs/
- integration/
- scripts/
non_canonical_dirs_forbidden:
- runtime_prototype/
- reference_prototype/
- tests/
- normalizer_tests/
- approval_tests/
- audit_tests/
- sandbox_tests/
- detection_tests/
- cloud_secops_tests/
- identity_secrets_tests/
- forensics_tests/
- __pycache__/
validation:
  frontmatter_yaml: strict
  missing_skill_paths: error
  missing_output_templates: error
  unknown_tools: error
  unknown_policy_decisions: error
  python_bytecode: error
  full_skill_body_default: forbidden
cybou_core_loader:
  phase_1: registry + frontmatter metadata only
  phase_2: skill selection from compact metadata
  phase_3: SkillVetter gates full body excerpts
  phase_4: policy compatibility check
  phase_5: immunity mapping
  phase_6: eval integration
trust_defaults:
  skills_enabled: false
  allow_full_body: false
  require_vetting: true
  max_prompt_skills: 8
  max_skill_excerpt_bytes: 4000
immunity_compatibility:
  manifest: immunity_mapping/immunity_manifest.yaml
  required: true
  validate_with: scripts/validate_immunity_compat_v6_3.py
supply_chain_trust:
  manifest: integration/supply_chain_manifest.yaml
  file_hashes: integration/file_hashes.yaml
  vetting_rules: integration/vetting_rules.yaml
  quarantine_policy: integration/quarantine_policy.yaml
  validate_with:
  - scripts/validate_supply_chain_v6_4.py
  - scripts/validate_skill_vetting_rules_v6_4.py
  - scripts/validate_command_patterns_v6_4.py
eval_runner_contract:
  manifest: evals/manifest.yaml
  validate_with:
  - scripts/validate_eval_contract_v6_5.py
  - scripts/validate_adversarial_immunity_v6_5.py
  learning_gate_required: true
release_signing:
  signing_policy: integration/signing_policy.yaml
  trusted_publishers: integration/trusted_publishers.yaml
  provenance_manifest: integration/provenance_manifest.yaml
  signature_status: integration/signature_status.yaml
  validate_with: scripts/validate_release_signing_v6_6.py
command_normalization:
  contract: immunity_mapping/argv_normalization_contract.yaml
  policy_hardening_validator: scripts/validate_policy_hardening_v6_7.py
  regex_is_metadata: true
  rust_normalizer_is_authority: true
repository_boundary:
  role: skills_corpus_only
  forbidden_runtime_code: true
  validate_with: scripts/validate_public_repository_cleanup_v6_8.py
