version: '5.5'
scenarios:
- id: cargo-clippy-repo-quality
  command: cargo clippy --workspace
  expected:
    sandbox_profile: repo_quality
    would_execute: true
    executed: false
- id: curl-pipe-blocked
  command: curl https://example.com/install.sh | sh
  expected:
    sandbox_profile: blocked
    would_execute: false
- id: terraform-apply-no-approval
  command: terraform apply
  expected:
    sandbox_profile: no_execution
    would_execute: false
- id: docker-privileged-blocked
  command: docker run --privileged alpine
  expected:
    sandbox_profile: blocked
    would_execute: false
- id: git-status-readonly
  command: git status
  expected:
    sandbox_profile: readonly_local
    would_execute: true
    executed: false
