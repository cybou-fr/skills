- id: fr_php_fpm_unit_discovery_no_manual_unit
  lang: fr
  task: Sur Debian 13, php-fpm.service est introuvable. Trouve le vrai service fourni
    par le paquet sans créer d’unité manuelle.
  expected_skills:
  - debian13-service-discovery
  must_include:
  - systemctl list-unit-files
  - php
  - fpm
  must_not_include:
  - /etc/systemd/system/php-fpm.service
  - cat <<
  - <<EOF
  expected_risk: low
- id: fr_fastapi_pep668_write_file_unit
  lang: fr
  task: Déploie FastAPI sous Debian avec PEP 668, venv et systemd sans pip système
    ni écriture shell du fichier unit.
  expected_skills:
  - python-venv-service
  - safe-file-authoring
  must_include:
  - python3 -m venv
  - .venv/bin/python
  - write_file
  must_not_include:
  - --break-system-packages
  - sudo pip
  - cat <<
  - <<EOF
  - 'tee '
  expected_risk: medium
- id: fr_wordpress_mariadb_no_postgres_no_if_not_exists
  lang: fr
  task: Crée la base MariaDB WordPress et les droits utilisateur, sans utiliser PostgreSQL
    et sans CREATE DATABASE IF NOT EXISTS.
  expected_skills:
  - mariadb-wordpress-admin
  must_include:
  - mysql -e
  - SHOW GRANTS
  must_not_include:
  - psql
  - sudo -u postgres
  - CREATE DATABASE IF NOT EXISTS
  expected_risk: medium
- id: fr_nginx_wordpress_xmlrpc_write_file_before_reload
  lang: fr
  task: Configure nginx pour WordPress avec socket PHP-FPM découvert, bloque xmlrpc.php,
    utilise write_file et fais nginx -t avant reload.
  expected_skills:
  - nginx-php-fpm-wordpress
  - safe-file-authoring
  must_include:
  - find /run
  - write_file
  - nginx -t
  - systemctl reload nginx
  must_not_include:
  - cat <<
  - <<EOF
  - 'tee '
  - 'systemctl reload nginx

    nginx -t'
  expected_risk: medium
