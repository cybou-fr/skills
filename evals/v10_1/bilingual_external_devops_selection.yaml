version: '10.1'
evals:
- id: en_debian13-service-discovery
  lang: en
  task: Handle a Debian external DevOps task about debian service discovery using
    the narrow skill.
  expected_skills:
  - debian13-service-discovery
  must_include:
  - debian service discovery
  - systemd unit discovery
  must_not_include:
  - cat <<
  - <<EOF
  - 'tee '
  - 'echo '
  - CREATE DATABASE IF NOT EXISTS
  expected_risk: low
