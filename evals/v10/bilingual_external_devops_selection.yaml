- id: en_debian13_service_discovery_1
  skill: debian13-service-discovery
  lang: en
  task: On Debian 13, php-fpm.service is not found after installing PHP-FPM. Discover the actual packaged unit before creating anything.
  category: eval_bilingual_external_devops_selection
  expected_skills:
  - debian13-service-discovery
  forbidden_skills: []
  expected_risk: low
  must_include:
  - systemctl list-unit-files '*php*fpm*'
  - dpkg -l | awk
  must_not_include:
  - /etc/systemd/system/php-fpm.service
  - cat > /etc/systemd/system/php-fpm.service
  metric: selected_relevant_skill
