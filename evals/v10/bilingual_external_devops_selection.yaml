- id: en_nginx_php_fpm_wordpress_1
  skill: nginx-php-fpm-wordpress
  lang: en
  task: Configure WordPress with nginx and PHP-FPM, discover the real PHP-FPM socket, deny xmlrpc.php, and reload only after nginx -t.
  category: eval_bilingual_external_devops_selection
  expected_skills:
  - nginx-php-fpm-wordpress
  - debian13-service-discovery
  - safe-file-authoring
  forbidden_skills: []
  expected_risk: medium
  must_include:
  - find /run /var/run -type s -name 'php*-fpm*.sock'
  - location = /xmlrpc.php
  - deny all;
  - nginx -t
  - systemctl reload nginx
  must_not_include:
  - fastcgi_pass unix:/run/php/php-fpm.sock;
  metric: selected_relevant_skill
