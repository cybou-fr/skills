version: '5.9'
scenarios:
- id: v55-router-cargo-clippy
  input: route cargo clippy through sandbox execution boundary
  expected:
    risk: low
    decision: allow_read_only
    required_skills:
    - cybou-core-tool-router-execution-prototype
    - cybou-core-sandbox-profile-engine
    tool: cargo
- id: v55-router-curl-pipe-blocked
  input: route curl pipe to shell and block execution
  expected:
    risk: critical
    decision: deny_by_default
    required_skills:
    - cybou-core-tool-execution-boundary
    - cybou-core-network-boundary
    tool: shell
    must_not_execute: true
