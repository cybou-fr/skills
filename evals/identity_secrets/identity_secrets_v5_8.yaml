version: '5.8'
scenarios:
- id: aws-access-key-detected
  secret_text: AWS key AKIA1234567890ABCDEF found in CI logs
  expected:
    severity: critical
    finding_count_min: 1
- id: generic-token-detected
  secret_text: token=abc123456789SECRET in build output
  expected:
    severity: high
    finding_count_min: 1
- id: oauth-high-risk-scopes
  oauth_app:
    app_id: app-1
    publisher: Unknown
    publisher_verified: false
    scopes:
    - User.ReadWrite.All
    - offline_access
    redirect_uris:
    - http://localhost/callback
  expected:
    severity: high
    risky_scope_min: 1
- id: kms-wildcard-policy
  key_policy:
    Statement:
    - Effect: Allow
      Principal: '*'
      Action: kms:*
      Resource: '*'
  expected:
    severity: high
    finding_count_min: 1
- id: privileged-without-mfa
  principal:
    id: admin@example.com
    privileged: true
    mfa_enabled: false
    last_seen_days: 3
  expected:
    severity: high
    reason: privileged_without_mfa
- id: stale-service-account-key
  principal:
    id: svc-prod
    service_account: true
    key_age_days: 180
    privileged: false
  expected:
    severity: medium
    reason: stale_service_account_key
