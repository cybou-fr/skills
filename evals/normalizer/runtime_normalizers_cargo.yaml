version: '5.2'
scenarios:
- id: cargo-clippy
  input: cargo clippy --workspace --all-targets --all-features -- -D warnings
  expected_normalized_action:
    tool: cargo
    operation: clippy
    target: cargo_workspace
    side_effects_contains: []
- id: cargo-publish
  input: cargo publish
  expected_normalized_action:
    tool: cargo
    operation: publish
    side_effects_contains:
    - write
    - external_publish
- id: cargo-add
  input: cargo add serde
  expected_normalized_action:
    tool: cargo
    operation: add
    side_effects_contains:
    - write
    - supply_chain_change
