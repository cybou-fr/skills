version: '5.2'
scenarios:
- id: tf-plan
  input: terraform -chdir=infra plan
  expected_normalized_action:
    tool: terraform
    operation: plan
    target: infra
- id: tf-destroy
  input: terraform destroy -auto-approve
  expected_normalized_action:
    tool: terraform
    operation: destroy
    side_effects_contains:
    - destructive
    - write
    - auto_approve
- id: tf-state-rm
  input: terraform state rm aws_instance.x
  expected_normalized_action:
    tool: terraform
    operation: state
    side_effects_contains:
    - write
    - state_mutation
