tool: cargo
version: '4.4'
default: review_required
rules:
- id: cargo-readonly-checks
  match_regex: ^\s*cargo\s+(check|test|fmt|clippy|metadata|tree|audit|deny)\b
  decision: allow_read_only
  risk: low
- id: cargo-install
  match_regex: ^\s*cargo\s+install\b
  decision: approval_required
  risk: high
- id: cargo-publish
  match_regex: ^\s*cargo\s+publish\b
  decision: approval_required
  risk: high
- id: cargo-update
  match_regex: ^\s*cargo\s+update\b
  decision: approval_required
  risk: medium
- id: cargo-run
  match_regex: ^\s*cargo\s+run\b
  decision: approval_required
  risk: medium
