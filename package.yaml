name: cybou-devops-secops-agent-skills
version: 5.5.0
license: Proprietary-or-custom
format: agentskills-compatible-cybou-sandbox-tool-execution-boundary
description: Runtime-oriented DevOps/SecOps skill library for autonomous or semi-autonomous AI workers.
entrypoints:
  registry: registry.yaml
  risk_matrix: risk_matrix.yaml
  tool_policies: tool_policies.yaml
  output_templates: output_templates.yaml
  cybou: cybou.yaml
compatibility:
  agentskills_io_style: true
  directory_per_skill: true
  required_skill_file: SKILL.md
  skill_md_required_frontmatter:
  - name
  - description
cybou_extensions:
